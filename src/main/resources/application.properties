spring.application.name=dividend-anatomy

# OCI Bastion 세션으로 로컬 포트에 포워딩된 MySQL DB System에 연결한다.
# 실제 DB System은 private subnet에만 있고 public IP가 없다 (docs/decisions 참고).
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/dividend_anatomy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${OCI_MYSQL_ADMIN_USERNAME:dividend_admin}
spring.datasource.password=${OCI_MYSQL_ADMIN_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

massive.base-url=${MASSIVE_BASE_URL:https://api.massive.com}
massive.api-key=${POLYGON_TOKEN:}
twelvedata.base-url=${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVEDATA_TOKEN:}
alphavantage.base-url=${ALPHAVANTAGE_BASE_URL:https://www.alphavantage.co}
alphavantage.api-key=${ALPHA_VANTAGE_TOKEN:}
