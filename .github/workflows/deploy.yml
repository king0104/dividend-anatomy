name: Build and Deploy

# main에 푸시되면 arm64 이미지를 빌드해 GHCR(public)에 올리고,
# k3s master에 SSH로 접속해 새 이미지로 롤아웃한다.
# 기존 수동 절차(docker save -> scp x3 -> ctr import x3 -> rollout restart)를 대체.
# 배경: docs/decisions/11-cicd-pipeline.md

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/king0104/dividend-anatomy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Roll out new image via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo k3s kubectl set image deployment/dividend-anatomy \
              dividend-anatomy=ghcr.io/king0104/dividend-anatomy:${{ github.sha }} \
              -n dividend-anatomy
            sudo k3s kubectl rollout status deployment/dividend-anatomy \
              -n dividend-anatomy --timeout=120s
